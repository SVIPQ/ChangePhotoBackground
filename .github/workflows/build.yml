name: Build Windows Installer EXE

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: "选择要生成的版本"
        required: true
        default: "installer"
        type: choice
        options:
          - installer
          - portable
          - all

env:
  APP_VERSION: "2.2.0.1"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4

      - name: 2. 配置 Python 3.11 环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 3. 安装依赖与 PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow rembg onnxruntime tkinterdnd2

      - name: 4. 预下载默认离线 AI 抠图模型 (birefnet-portrait)
        env:
          U2NET_HOME: ${{ github.workspace }}\build_u2net\.u2net
        run: |
          python -c "import os; os.makedirs(os.environ['U2NET_HOME'], exist_ok=True); from rembg import new_session; new_session('birefnet-portrait')"

      - name: 5. 生成与 APP_VERSION 同步的 EXE 版本信息文件
        shell: pwsh
        run: |
          $ver = "${{ env.APP_VERSION }}".Trim().TrimStart('v', 'V')
          $parts = @($ver -split '\.' | Where-Object { $_ -match '^\d+$' })
          while ($parts.Count -lt 4) { $parts += "0" }
          $vTuple = "$($parts[0]), $($parts[1]), $($parts[2]), $($parts[3])"
          $verStr = "${{ env.APP_VERSION }}"

          $content = @"
          VSVersionInfo(
            ffi=FixedFileInfo(
              filevers=($vTuple),
              prodvers=($vTuple),
              mask=0x3f,
              flags=0x0,
              OS=0x40004,
              fileType=0x1,
              subtype=0x0,
              date=(0, 0)
            ),
            kids=[
              StringFileInfo([
                StringTable(
                  u'080404b0',
                  [
                    StringStruct(u'CompanyName', u'Czq'),
                    StringStruct(u'FileDescription', u'证件照批量换底色工具_Czq'),
                    StringStruct(u'FileVersion', u'$verStr'),
                    StringStruct(u'InternalName', u'证件照批量换底色工具_Czq'),
                    StringStruct(u'LegalCopyright', u'Copyright (c) Czq'),
                    StringStruct(u'OriginalFilename', u'证件照批量换底色工具_Czq.exe'),
                    StringStruct(u'ProductName', u'证件照批量换底色工具_Czq'),
                    StringStruct(u'ProductVersion', u'$verStr')
                  ]
                )
              ]),
              VarFileInfo([VarStruct(u'Translation', [2052, 1200])])
            ]
          )
          "@
          Set-Content -Path "version_info.txt" -Value $content -Encoding UTF8

      - name: 6. 使用 PyInstaller 打包免安装文件夹（含版本信息、元数据与默认模型）
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed `
            --name "证件照批量换底色工具_Czq" `
            --icon "app.ico" `
            --version-file "version_info.txt" `
            --copy-metadata pymatting `
            --collect-all tkinterdnd2 `
            --collect-all rembg `
            --add-data "app.ico;." `
            --add-data "build_u2net\.u2net;.u2net" `
            "证件照批量换底色.py"

      - name: 7. 同步版本号并编译 Inno Setup 安装程序
        if: ${{ github.event.inputs.build_target == 'installer' || github.event.inputs.build_target == 'all' }}
        shell: pwsh
        run: |
          $verStr = "${{ env.APP_VERSION }}"
          (Get-Content "installer.iss" -Raw) -replace '#define MyAppVersion ".*"', "#define MyAppVersion `"$verStr`"" | Set-Content "installer.iss" -NoNewline -Encoding UTF8
          choco install innosetup -y
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "ISCC.exe" }
          & $iscc "installer.iss"

      - name: 8. 打包免安装文件夹为便携 ZIP
        if: ${{ github.event.inputs.build_target == 'portable' || github.event.inputs.build_target == 'all' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "portable_out" | Out-Null
          $zipPath = "portable_out\证件照批量换底色工具_Czq_免安装版_v${{ env.APP_VERSION }}.zip"
          Compress-Archive -Path "dist\证件照批量换底色工具_Czq" -DestinationPath $zipPath -Force

      - name: 9. 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: 证件照批量换底色工具_Czq_v${{ env.APP_VERSION }}
          path: |
            output\*.exe
            portable_out\*.zip
          if-no-files-found: ignore