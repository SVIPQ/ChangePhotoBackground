name: Build Windows Installer EXE

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4

      - name: 2. 配置 Python 3.11 环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 3. 安装依赖与 PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow rembg onnxruntime

      - name: 4. 预下载离线 AI 抠图模型 (.u2net)
        shell: pwsh
        run: |
          $env:U2NET_HOME = "$PWD\.u2net"
          New-Item -ItemType Directory -Force -Path $env:U2NET_HOME | Out-Null
          python -c "import os; os.environ['U2NET_HOME'] = os.path.abspath('.u2net'); from rembg import new_session; new_session('u2net'); print('Model downloaded to:', os.environ['U2NET_HOME'])"

      - name: 5. 准备图标与资源检查
        shell: pwsh
        run: |
          if (-not (Test-Path "app.ico")) {
            python -c "from PIL import Image; img = Image.new('RGBA', (256, 256), (37, 99, 235, 255)); img.save('app.ico', format='ICO', sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)])"
          }

      - name: 6. 打包程序根目录（含自定义图标、离线模型与包元数据）
        shell: pwsh
        run: |
          $entryScript = Get-ChildItem -Filter "*.py" | Where-Object { $_.Name -notlike "test*" } | Select-Object -First 1
          if (-not $entryScript) {
            throw "未找到主 Python 脚本（*.py）"
          }
          pyinstaller --noconfirm --clean --onedir --windowed `
            --name "证件照批量换底色工具_Czq" `
            --icon "app.ico" `
            --add-data ".u2net;.u2net" `
            --copy-metadata pymatting `
            --copy-metadata rembg `
            --copy-metadata onnxruntime `
            --copy-metadata pillow `
            --collect-all rembg `
            --collect-all onnxruntime `
            $entryScript.FullName

      - name: 7. 安装 Inno Setup 并编译安装程序 EXE
        shell: pwsh
        run: |
          choco install innosetup -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer.iss"

      - name: 8. 上传最终安装程序
        uses: actions/upload-artifact@v4
        with:
          name: 证件照批量换底色工具_安装程序_Czq
          path: Output\证件照批量换底色工具_安装程序_Czq.exe
