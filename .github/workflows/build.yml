name: Build Windows Installer EXE

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: "选择要生成的版本"
        required: true
        default: "installer"
        type: choice
        options:
          - installer
          - portable
          - all
  push:
    branches: [ main, master ]

env:
  APP_VERSION: "4.0.0.2"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4

      - name: 2. 配置 Python 3.11 环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 3. 安装依赖与 PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow rembg onnxruntime tkinterdnd2

      - name: 4. 预下载默认离线 AI 抠图模型 (仅 birefnet-portrait)
        env:
          U2NET_HOME: ${{ github.workspace }}\build_u2net\.u2net
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:U2NET_HOME\models\birefnet-portrait" | Out-Null
          New-Item -ItemType Directory -Force -Path "$env:U2NET_HOME\models\isnet-general-use" | Out-Null
          New-Item -ItemType Directory -Force -Path "$env:U2NET_HOME\models\u2net" | Out-Null
          python -c "import os, gc; os.makedirs(os.environ['U2NET_HOME'], exist_ok=True); from rembg import new_session; print('Downloading birefnet-portrait...'); s = new_session('birefnet-portrait'); del s; gc.collect()"
          Get-ChildItem -Path "$env:U2NET_HOME" -File -Include *.onnx,*.pth,*.pt | ForEach-Object {
            if ($_.Name -like "*birefnet*") {
              Move-Item -Path $_.FullName -Destination "$env:U2NET_HOME\models\birefnet-portrait\$($_.Name)" -Force
            }
          }

      - name: 5. 生成与 APP_VERSION 同步的 EXE 版本信息文件
        shell: pwsh
        run: |
          $ver = "${{ env.APP_VERSION }}".Trim().TrimStart('v', 'V')
          $parts = @($ver -split '\.' | Where-Object { $_ -match '^\d+$' })
          while ($parts.Count -lt 4) {$parts += "0" }
          $vTuple = "$($parts[0]), $($parts[1]), $($parts[2]), $($parts[3])"
          $verStr = "${{ env.APP_VERSION }}"

          $content = @"
          VSVersionInfo(
            ffi=FixedFileInfo(
              filevers=($vTuple),
              prodvers=($vTuple