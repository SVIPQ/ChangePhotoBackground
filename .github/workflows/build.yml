name: Build Windows Installer EXE

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4

      - name: 2. 配置 Python 3.11 环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 3. 安装依赖与 PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow rembg onnxruntime

      - name: 4. 预下载离线 AI 抠图模型 (.u2net)
        shell: pwsh
        run: |
          $env:U2NET_HOME = "$PWD\.u2net"
          New-Item -ItemType Directory -Force -Path $env:U2NET_HOME | Out-Null
          python -c "import os; os.environ['U2NET_HOME'] = os.path.abspath('.u2net'); from rembg import new_session; new_session('u2net'); print('Model downloaded to:', os.environ['U2NET_HOME'])"

      - name: 5. 准备图标与资源检查
        shell: pwsh
        run: |
          if (-not (Test-Path "app.ico")) {
            python -c "from PIL import Image; img = Image.new('RGBA', (256, 256), (37, 99, 235, 255)); img.save('app.ico', format='ICO', sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)])"
          }

      - name: 6. 打包程序根目录（含自定义图标与离线模型）
        shell: pwsh
        run: |
          $entryScript = Get-ChildItem -Filter "*.py" | Where-Object { $_.Name -notlike "test*" } | Select-Object -First 1
          if (-not $entryScript) {
            throw "未找到主 Python 脚本（*.py）"
          }
          pyinstaller --noconfirm --clean --onedir --windowed `
            --name "证件照批量换底色工具_Czq" `
            --icon "app.ico" `
            --add-data ".u2net;.u2net" `
            --collect-all rembg `
            --collect-all onnxruntime `
            $entryScript.FullName

      - name: 7. 安装 Inno Setup、准备简体中文语言包并编译安装程序 EXE
        shell: pwsh
        run: |
          choco install innosetup -y
          $langDir = "C:\Program Files (x86)\Inno Setup 6\Languages"
          $langFile = Join-Path $langDir "ChineseSimplified.isl"
          New-Item -ItemType Directory -Force -Path $langDir | Out-Null

          if (-not (Test-Path $langFile)) {
            $urls = @(
              "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Unofficial/ChineseSimplified.isl",
              "https://cdn.jsdelivr.net/gh/jrsoftware/issrc@main/Files/Languages/Unofficial/ChineseSimplified.isl"
            )
            $downloaded = $false
            foreach ($u in $urls) {
              try {
                Invoke-WebRequest -Uri $u -OutFile $langFile -UseBasicParsing -TimeoutSec 30
                if ((Test-Path $langFile) -and ((Get-Item $langFile).Length -gt 1024)) {
                  $downloaded = $true
                  break
                }
              } catch {
                Write-Host "下载失败，尝试下一个源: $u -> $_"
              }
            }
            if (-not $downloaded) {
              throw "无法下载 ChineseSimplified.isl，请检查网络或将该文件提交到仓库根目录。"
            }
          }

          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer.iss"

      - name: 8. 上传最终安装程序
        uses: actions/upload-artifact@v4
        with:
          name: 证件照批量换底色工具_安装程序_Czq
          path: Output\证件照批量换底色工具_安装程序_Czq.exe
